# Publishes the Storix release artifacts the installer and the self updater read.
# Developed by X Project.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then tag="${{ github.event.inputs.tag }}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build the interface
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: Cross compile
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X github.com/XProject25/Storix/internal/build.Version=${VERSION} \
            -X github.com/XProject25/Storix/internal/build.Commit=${COMMIT} \
            -X github.com/XProject25/Storix/internal/build.Date=${DATE}"
          for target in linux/amd64 linux/arm64 linux/arm; do
            os=${target%/*}; arch=${target#*/}
            echo "building ${os}/${arch}"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "${LDFLAGS}" -o dist/storix ./cmd/storix
            tar -czf "dist/storix_${VERSION}_${os}_${arch}.tar.gz" -C dist storix
            rm -f dist/storix
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Storix ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/XProject25/Storix/main/scripts/install.sh | sudo bash
            ```

            ## Update an existing server

            ```
            sudo storix update
            sudo systemctl restart storix
            ```

            Developed by X Project.
